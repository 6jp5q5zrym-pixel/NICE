# Configuración de entornos Actimize — Módulo Remesas
# Formato: clave=valor, secciones entre corchetes
# Sensibles: usar variables de entorno o vault (indicado con ${VAULT:...})

# ============================================================
# ENTORNO: DESARROLLO (DEV)
# ============================================================
[dev]
actimize.host=actimize-dev.bancoes.local
actimize.port=8443
actimize.api.base_url=https://actimize-dev.bancoes.local:8443/actimize/api/v2
actimize.api.client_id=BANCOES_DEV
actimize.api.secret=${VAULT:actimize/dev/api_secret}

# SFTP para carga de ficheros batch
sftp.host=sftp-actimize-dev.bancoes.local
sftp.port=22
sftp.user=actimize_dev_upload
sftp.key_path=/etc/actimize/keys/dev/sftp_rsa
sftp.remote_path=/actimize/input/remesas/
sftp.archive_path=/actimize/archive/remesas/

# Base de datos Actimize (lectura para validación)
db.host=actimize-db-dev.bancoes.local
db.port=1521
db.name=ACTDEV
db.schema=ACT_REMESAS
db.user=act_remesas_dev
db.password=${VAULT:actimize/dev/db_password}

# IBM MQ
mq.host=mq-dev.bancoes.local
mq.port=1414
mq.queue_manager=ACTIMIZE.QM.DEV
mq.channel=ACT.DEV.SVRCONN
mq.queue_in=ACTIMIZE.REMITTANCES.IN.DEV
mq.queue_dlq=ACTIMIZE.DLQ.DEV
mq.ssl_keystore=${VAULT:actimize/dev/mq_keystore}

# Parámetros de carga
batch.max_records_per_file=50000
batch.schedule_cron=0 2 * * *
batch.retry_max=3
batch.retry_delay_seconds=60

# Datos sintéticos en DEV — NO usar datos reales
data.use_synthetic=true
data.anonymize=false

# ============================================================
# ENTORNO: PRE-PRODUCCIÓN (PRE)
# ============================================================
[pre]
actimize.host=actimize-pre.bancoes.local
actimize.port=8443
actimize.api.base_url=https://actimize-pre.bancoes.local:8443/actimize/api/v2
actimize.api.client_id=BANCOES_PRE
actimize.api.secret=${VAULT:actimize/pre/api_secret}

sftp.host=sftp-actimize-pre.bancoes.local
sftp.port=22
sftp.user=actimize_pre_upload
sftp.key_path=/etc/actimize/keys/pre/sftp_rsa
sftp.remote_path=/actimize/input/remesas/
sftp.archive_path=/actimize/archive/remesas/

db.host=actimize-db-pre.bancoes.local
db.port=1521
db.name=ACTPRE
db.schema=ACT_REMESAS
db.user=act_remesas_pre
db.password=${VAULT:actimize/pre/db_password}

mq.host=mq-pre.bancoes.local
mq.port=1414
mq.queue_manager=ACTIMIZE.QM.PRE
mq.channel=ACT.PRE.SVRCONN
mq.queue_in=ACTIMIZE.REMITTANCES.IN.PRE
mq.queue_dlq=ACTIMIZE.DLQ.PRE
mq.ssl_keystore=${VAULT:actimize/pre/mq_keystore}

batch.max_records_per_file=100000
batch.schedule_cron=0 2 * * *
batch.retry_max=3
batch.retry_delay_seconds=60

# PRE usa copia anonimizada de producción (RGPD)
data.use_synthetic=false
data.anonymize=true
data.anonymize_fields=originator_name,originator_id_number,beneficiary_name,originator_account,beneficiary_account

# ============================================================
# ENTORNO: PRODUCCIÓN (PRO)
# ============================================================
[pro]
actimize.host=actimize-pro.bancoes.local
actimize.port=8443
actimize.api.base_url=https://actimize-pro.bancoes.local:8443/actimize/api/v2
actimize.api.client_id=BANCOES_PRO
actimize.api.secret=${VAULT:actimize/pro/api_secret}

sftp.host=sftp-actimize-pro.bancoes.local
sftp.port=22
sftp.user=actimize_pro_upload
sftp.key_path=/etc/actimize/keys/pro/sftp_rsa
sftp.remote_path=/actimize/input/remesas/
sftp.archive_path=/actimize/archive/remesas/

db.host=actimize-db-pro.bancoes.local
db.port=1521
db.name=ACTPRO
db.schema=ACT_REMESAS
db.user=act_remesas_pro
db.password=${VAULT:actimize/pro/db_password}

mq.host=mq-pro.bancoes.local
mq.port=1414
mq.queue_manager=ACTIMIZE.QM.PRO
mq.channel=ACT.PRO.SVRCONN
mq.queue_in=ACTIMIZE.REMITTANCES.IN
mq.queue_dlq=ACTIMIZE.DLQ
mq.ssl_keystore=${VAULT:actimize/pro/mq_keystore}

batch.max_records_per_file=200000
batch.schedule_cron=0 2 * * *
batch.retry_max=5
batch.retry_delay_seconds=30

# Producción usa datos reales
data.use_synthetic=false
data.anonymize=false

# SLAs producción
sla.wlf_realtime_ms=3000
sla.batch_load_max_hours=4
sla.alert_generation_max_hours=6

# Alertas de monitorización
monitoring.alert_email=aml-ops@bancoes.es
monitoring.alert_slack_webhook=${VAULT:actimize/pro/slack_webhook}
monitoring.batch_failure_threshold=0.01
