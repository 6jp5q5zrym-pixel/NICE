# Configuración de entornos NICE Actimize IFM — Módulo Remesas
# Módulo: Intelligent Fraud Management (IFM) — Detección de fraude en tiempo real
# Plataforma: Windows Server
# Formato: clave=valor, secciones entre corchetes [entorno]
# Sensibles: usar HashiCorp Vault (indicado con ${VAULT:...})
# Nota: rutas en formato Windows UNC o drive local del servidor IFM

# ============================================================
# ENTORNO: DESARROLLO (DEV)
# ============================================================
[dev]
# IFM API
ifm.host=ifm-dev.bancoes.local
ifm.port=8443
ifm.api.base_url=https://ifm-dev.bancoes.local:8443/ifm/api/v2
ifm.api.client_id=BANCOES_DEV
ifm.api.secret=${VAULT:actimize/ifm/dev/api_secret}

# SFTP para carga de ficheros batch (servidor SFTP externo a Windows)
sftp.host=sftp-ifm-dev.bancoes.local
sftp.port=22
sftp.user=ifm_dev_upload
sftp.key_path=C:\Actimize\IFM\keys\dev\sftp_rsa
sftp.remote_path=/ifm/input/remesas/
sftp.archive_path=/ifm/archive/remesas/

# Base de datos fuente (Oracle Core Banking — acceso de lectura)
db.host=corebanking-db-dev.bancoes.local
db.port=1521
db.name=CBDEV
db.schema=PAYMENTS
db.user=ifm_reader_dev
db.password=${VAULT:actimize/ifm/dev/db_password}

# IBM MQ (integración en tiempo real)
mq.host=mq-dev.bancoes.local
mq.port=1414
mq.queue_manager=IFM.QM.DEV
mq.channel=IFM.DEV.SVRCONN
mq.queue_in=IFM.REMITTANCES.IN.DEV
mq.queue_dlq=IFM.DLQ.DEV
mq.ssl_keystore=${VAULT:actimize/ifm/dev/mq_keystore}

# Rutas locales Windows del servidor IFM
local.batch_output_dir=C:\Actimize\IFM\batch\output\remesas
local.batch_archive_dir=C:\Actimize\IFM\batch\archive\remesas
local.log_dir=C:\Actimize\IFM\logs
local.pgp_key_path=C:\Actimize\IFM\keys\dev\ifm-ingest-dev.asc

# Parámetros de carga
batch.max_records_per_file=50000
batch.schedule=02:00
batch.retry_max=3
batch.retry_delay_seconds=60

# Datos sintéticos en DEV — NO usar datos reales
data.use_synthetic=true
data.anonymize=false

# SLAs
sla.ifm_realtime_ms=500
sla.batch_load_max_hours=4
sla.fraud_score_max_ms=200

# ============================================================
# ENTORNO: PRE-PRODUCCIÓN (PRE)
# ============================================================
[pre]
ifm.host=ifm-pre.bancoes.local
ifm.port=8443
ifm.api.base_url=https://ifm-pre.bancoes.local:8443/ifm/api/v2
ifm.api.client_id=BANCOES_PRE
ifm.api.secret=${VAULT:actimize/ifm/pre/api_secret}

sftp.host=sftp-ifm-pre.bancoes.local
sftp.port=22
sftp.user=ifm_pre_upload
sftp.key_path=C:\Actimize\IFM\keys\pre\sftp_rsa
sftp.remote_path=/ifm/input/remesas/
sftp.archive_path=/ifm/archive/remesas/

db.host=corebanking-db-pre.bancoes.local
db.port=1521
db.name=CBPRE
db.schema=PAYMENTS
db.user=ifm_reader_pre
db.password=${VAULT:actimize/ifm/pre/db_password}

mq.host=mq-pre.bancoes.local
mq.port=1414
mq.queue_manager=IFM.QM.PRE
mq.channel=IFM.PRE.SVRCONN
mq.queue_in=IFM.REMITTANCES.IN.PRE
mq.queue_dlq=IFM.DLQ.PRE
mq.ssl_keystore=${VAULT:actimize/ifm/pre/mq_keystore}

local.batch_output_dir=C:\Actimize\IFM\batch\output\remesas
local.batch_archive_dir=C:\Actimize\IFM\batch\archive\remesas
local.log_dir=C:\Actimize\IFM\logs
local.pgp_key_path=C:\Actimize\IFM\keys\pre\ifm-ingest-pre.asc

batch.max_records_per_file=100000
batch.schedule=02:00
batch.retry_max=3
batch.retry_delay_seconds=60

# PRE usa copia anonimizada de producción (RGPD)
data.use_synthetic=false
data.anonymize=true
data.anonymize_fields=originator_name,originator_id_number,beneficiary_name,originator_account,beneficiary_account

sla.ifm_realtime_ms=500
sla.batch_load_max_hours=4
sla.fraud_score_max_ms=200

# ============================================================
# ENTORNO: PRODUCCIÓN (PRO)
# ============================================================
[pro]
ifm.host=ifm-pro.bancoes.local
ifm.port=8443
ifm.api.base_url=https://ifm-pro.bancoes.local:8443/ifm/api/v2
ifm.api.client_id=BANCOES_PRO
ifm.api.secret=${VAULT:actimize/ifm/pro/api_secret}

sftp.host=sftp-ifm-pro.bancoes.local
sftp.port=22
sftp.user=ifm_pro_upload
sftp.key_path=C:\Actimize\IFM\keys\pro\sftp_rsa
sftp.remote_path=/ifm/input/remesas/
sftp.archive_path=/ifm/archive/remesas/

db.host=corebanking-db-pro.bancoes.local
db.port=1521
db.name=CBPRO
db.schema=PAYMENTS
db.user=ifm_reader_pro
db.password=${VAULT:actimize/ifm/pro/db_password}

mq.host=mq-pro.bancoes.local
mq.port=1414
mq.queue_manager=IFM.QM.PRO
mq.channel=IFM.PRO.SVRCONN
mq.queue_in=IFM.REMITTANCES.IN
mq.queue_dlq=IFM.DLQ
mq.ssl_keystore=${VAULT:actimize/ifm/pro/mq_keystore}

local.batch_output_dir=C:\Actimize\IFM\batch\output\remesas
local.batch_archive_dir=C:\Actimize\IFM\batch\archive\remesas
local.log_dir=C:\Actimize\IFM\logs
local.pgp_key_path=C:\Actimize\IFM\keys\pro\ifm-ingest-pro.asc

batch.max_records_per_file=200000
batch.schedule=02:00
batch.retry_max=5
batch.retry_delay_seconds=30

# Producción usa datos reales
data.use_synthetic=false
data.anonymize=false

# SLAs producción
sla.ifm_realtime_ms=500
sla.batch_load_max_hours=4
sla.fraud_score_max_ms=200
sla.alert_generation_max_seconds=30

# Alertas de monitorización
monitoring.alert_email=fraud-ops@bancoes.es
monitoring.alert_slack_webhook=${VAULT:actimize/ifm/pro/slack_webhook}
monitoring.batch_failure_threshold=0.01
monitoring.fraud_alert_queue=IFM.FRAUD.ALERTS.PRO
