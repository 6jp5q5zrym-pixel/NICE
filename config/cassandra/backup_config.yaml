# Cassandra Backup Configuration – DSE 6.8.36
# Used by all backup scripts in scripts/cassandra/backup/

cassandra:
  dse_version: "6.8.36"
  cqlsh_host: "127.0.0.1"
  cqlsh_port: 9042
  data_dir: "/datos/dse-data"
  commitlog_dir: "/datos/dse-data/commitlog"
  staging_dir: "/datos/backup_staging"      # temp dir to build tar.gz – max ~100 GB needed

# Infrastructure per environment (confirmed)
environments:
  development:
    datacenter: "CPD1"
    nodes_per_dc: 1
    total_nodes: 1
    cpu: 4
    ram_gb: 16
    data_disk_gb: 100
    log_disk_gb: 50
    replication_factor_per_dc: 1
    retention_days: 30
    keyspaces:
      - "ff_prf_usr_dev"
      - "ff_prf_anlts_dev"
      - "ff_prf_sol_dev"

  preproduction:
    datacenter: "CPD1"
    nodes_per_dc: 1
    total_nodes: 2          # 1 per DC (confirmed: 172.28.58.94 CPD1, 172.28.58.95 CPD2)
    cpu: 4
    ram_gb: 16
    data_disk_gb: 100
    log_disk_gb: 50
    replication_factor_per_dc: 1
    retention_days: 30
    keyspaces:
      - "ff_prf_usr_dev"
      - "ff_prf_anlts_dev"
      - "ff_prf_sol_dev"

  production:
    datacenter: "CPD1"      # CPD from which backups are taken
    nodes_per_dc: 2
    total_nodes: 4          # 2 per DC (CPD1 + CPD2)
    cpu: 16
    ram_gb: 32
    data_disk_gb: 650
    log_disk_gb: 300
    replication_factor_per_dc: 2    # RF=2: max for 2 nodes/DC, 1 node can fail per DC
    retention_days: 30
    keyspaces:
      - "ff_prf_usr_pro"
      - "ff_prf_anlts_pro"
      - "ff_prf_sol_pro"
    archive:
      frequency: "semiannual"     # January 1 and July 1
      retention_years: 10

# Keyspaces to exclude from all backups (DSE/Cassandra internal)
keyspaces_exclude:
  - "system"
  - "system_auth"
  - "system_schema"
  - "system_distributed"
  - "system_traces"
  - "system_views"
  - "system_virtual_schema"
  - "system_backups"
  - "dse_system"
  - "dse_system_local"
  - "dse_security"
  - "dse_leases"
  - "dse_insights"
  - "dse_insights_local"
  - "dse_perf"
  - "solr_admin"
  - "migration_keyspace"

backup:
  daily_snapshot:
    schedule: "0 1 * * *"        # 01:00 every day
    snapshot_name_prefix: "daily"
    # Run on ONE node per DC only – both nodes in a DC hold identical data (RF=2)

  commitlog:
    schedule: "0 * * * *"        # every hour – RPO ≈ 1 hour
    retention_days: 30
    # Run on all nodes (each node has its own commit log)

  schema:
    schedule: "50 0 * * *"       # 00:50 – 10 min before daily snapshot
    retention_days: 30

# Cohesity pickup directories
cohesity:
  pickup_dirs:
    daily:      "/mnt/cohesity_pickup/cassandra/daily"
    commitlogs: "/mnt/cohesity_pickup/cassandra/commitlogs"
    schema:     "/mnt/cohesity_pickup/cassandra/schema"
    archive:    "/mnt/cohesity_pickup/cassandra/archive"
  policies:
    daily:      "cassandra-daily-30d"
    commitlogs: "cassandra-commitlog-30d"
    archive:    "cassandra-archive-10y"
  notification_email: "dba-team@bank.internal"

# Volumetry – confirmed from SQL pre-migration query (2026-04-29)
volumetry:
  source: "SQL pre-migration measurement"
  total_profiles: 225352959
  avg_blob_bytes: 420
  min_blob_bytes: 62
  max_blob_bytes: 189182        # outlier: 450x above average – review with app team
  total_sql_data_gb: 88
  cassandra_data_per_node_gb: 106   # 88 GB + ~20% SSTable overhead (no compression on profile table)
  staging_space_needed_gb: 110      # temp space in /datos during backup build
  backup_package_size_gb: 100       # blobs are pre-compressed (zlib), tar.gz ratio ~1:1
  cohesity_storage:
    daily_per_node_gb: 100
    nodes_backed_up: 2              # 1 node per DC × 2 DCs
    retention_days: 30
    total_30d_tb: 6                 # 100 GB × 2 nodes × 30 days = 6 TB
    archive_per_semester_gb: 200    # 2 nodes × ~100 GB
    archive_10y_tb: 4               # 20 semesters × 200 GB

logging:
  log_dir: "/logs/cassandra/backup"
  log_level: "INFO"
