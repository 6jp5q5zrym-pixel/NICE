# cassandra-rackdc.properties – Nodos del datacenter CPD1 (PRODUCCIÓN)
# Copiar a: /etc/dse/cassandra/cassandra-rackdc.properties  (instalación por paquete)
#       o:  <install>/resources/cassandra/conf/cassandra-rackdc.properties
#
# Este fichero es IDÉNTICO en los 2 nodos de CPD1.
# Los nodos de CPD2 usan rackdc_CPD2.properties (dc=CPD2).
#
# IMPORTANTE: el valor de 'dc' aquí debe coincidir EXACTAMENTE con el nombre
# usado en los CREATE/ALTER KEYSPACE (NetworkTopologyStrategy → 'CPD1': 2).

dc=CPD1
rack=rack1

# prefer_local=true: el nodo usa la IP local para gossip intra-DC,
# reduciendo tráfico WAN entre datacenters.
prefer_local=true
